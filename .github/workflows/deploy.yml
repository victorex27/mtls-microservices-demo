name: Deploy to EC2 (Terraform + dokku)

# Manual trigger by design: provisioning/deploying infra on every push is
# more automation than most people want for a demo repo. Flip this to
# `push: branches: [main]` once you're comfortable with what it does.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'terraform action'
        required: true
        default: 'apply'
        type: choice
        options: [apply, destroy]

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      instance_ip: ${{ steps.tf_outputs.outputs.instance_ip }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Export outputs
        id: tf_outputs
        if: github.event.inputs.action == 'apply'
        run: |
          echo "instance_ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
          terraform output -raw private_key_path > /tmp/keyname.txt

      - name: Save SSH private key as artifact input for deploy job
        if: github.event.inputs.action == 'apply'
        run: |
          mkdir -p /tmp/tfkey
          cp "$(cat /tmp/keyname.txt)" /tmp/tfkey/deploy-key.pem
        working-directory: terraform

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.action == 'apply'
        with:
          name: deploy-key
          path: /tmp/tfkey/deploy-key.pem
          retention-days: 1

  deploy-apps:
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event.inputs.action == 'apply'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deploy.sh uses `git subtree split`, needs full history

      - uses: actions/download-artifact@v4
        with:
          name: deploy-key
          path: terraform

      - name: Wait for instance SSH to come up
        run: |
          chmod 600 terraform/deploy-key.pem
          for i in $(seq 1 30); do
            ssh -i terraform/deploy-key.pem -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=5 ubuntu@${{ needs.terraform.outputs.instance_ip }} \
              'test -f /var/log/mtls-demo-bootstrap-done' && break
            echo "waiting for cloud-init to finish..."
            sleep 15
          done

      - name: Configure git identity (needed for subtree split)
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI Deploy Bot"

      - name: Run deploy.sh
        env:
          EC2_HOST: ${{ needs.terraform.outputs.instance_ip }}
          SSH_KEY: terraform/deploy-key.pem
        run: ./scripts/deploy.sh

      - name: Smoke test mTLS against the deployed gateway
        env:
          VAULT_ADDR: https://${{ needs.terraform.outputs.instance_ip }}:8200
        run: |
          (cd vault && ./scripts/issue-test-client-cert.sh)
          ./scripts/test-mtls.sh https://api-gateway:3000 ${{ needs.terraform.outputs.instance_ip }}
