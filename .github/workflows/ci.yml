name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, users-service, orders-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: ${{ matrix.service }}
        run: npm install --no-audit --no-fund

      - name: Build (tsc)
        working-directory: ${{ matrix.service }}
        run: npm run build

  local-mtls-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate local certs
        run: ./scripts/gen-local-certs.sh

      - name: Start all 3 services
        run: |
          nohup ./scripts/run-local.sh > run-local.log 2>&1 &
          disown

      - name: Wait for gateway to be reachable (mTLS handshake, not just TCP)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 \
              --cert certs/local/test-client/tls-cert.pem \
              --key certs/local/test-client/tls-key.pem \
              --cacert certs/local/test-client/ca-cert.pem \
              https://localhost:3000/healthz || echo "000")
            if [ "$code" = "200" ]; then
              echo "gateway ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "gateway never became ready after 60s - dumping logs:" >&2
          cat run-local.log >&2
          exit 1

      - name: Run mTLS test suite
        run: ./scripts/test-mtls.sh https://localhost:3000

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-local-logs
          path: run-local.log

  vault-stack-smoke-test:
    # Full production-style path: real Vault server (Raft storage), real
    # PKI two-tier CA, real AppRole auth, real Vault Agent sidecars issuing
    # and rotating certs - the whole point of docs/VAULT.md, actually
    # exercised end to end rather than just written down. Runs on every
    # push precisely because this repo isn't meant to be "looks right, has
    # never actually run."
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Install Vault CLI
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -y
          sudo apt-get install -y vault jq
          vault version

      - name: Generate Vault's own listener cert
        run: ./vault/scripts/gen-vault-listener-cert.sh

      - name: Bring up Vault only
        run: docker compose up -d vault

      - name: Wait for Vault to be healthy
        run: |
          export VAULT_ADDR=https://127.0.0.1:8200
          export VAULT_CACERT="$(pwd)/vault/tls/vault-ca.pem"
          attempts=0
          max_container_restarts=3
          restarts=0
          for i in $(seq 1 60); do
            if curl -sk --cacert "$VAULT_CACERT" "$VAULT_ADDR/v1/sys/health?standbyok=true" >/dev/null 2>&1; then
              echo "vault healthy after ~$((i*2))s"
              exit 0
            fi

            # Don't just spin against a dead container for 2 minutes: if it
            # already exited, print why immediately and, unless we've
            # already retried a few times (a real bug, not a transient
            # port-publish race), try bringing it back up.
            state=$(docker compose ps vault --format '{{.State}}' 2>/dev/null || echo "unknown")
            if [ "$state" = "exited" ]; then
              echo "--- vault container exited (attempt $((restarts+1))/${max_container_restarts}); logs: ---"
              docker compose logs --no-color vault
              restarts=$((restarts + 1))
              if [ "$restarts" -gt "$max_container_restarts" ]; then
                echo "::error::vault container kept exiting after ${max_container_restarts} restarts - see logs above"
                exit 1
              fi
              echo "--- retrying: docker compose up -d vault ---"
              docker compose up -d vault
              sleep 3
              continue
            fi

            sleep 2
          done
          echo "::error::vault never became healthy within 120s (last state: $state)"
          docker compose logs --no-color vault
          exit 1

      - name: Initialize + unseal + configure PKI + AppRoles
        run: |
          (cd vault && ./scripts/init-vault.sh)
          (cd vault && ./scripts/setup-pki.sh)
          (cd vault && ./scripts/setup-approles.sh)

      - name: Bring up Vault Agent sidecars + all 3 apps
        run: docker compose up -d --build

      - name: Wait for certs to be issued
        run: |
          for i in $(seq 1 60); do
            g=$(docker compose exec -T gateway sh -c '[ -s "$TLS_CERT_PATH" ] && echo yes || echo no' 2>/dev/null || echo no)
            u=$(docker compose exec -T users-service sh -c '[ -s "$TLS_CERT_PATH" ] && echo yes || echo no' 2>/dev/null || echo no)
            o=$(docker compose exec -T orders-service sh -c '[ -s "$TLS_CERT_PATH" ] && echo yes || echo no' 2>/dev/null || echo no)
            if [ "$g" = "yes" ] && [ "$u" = "yes" ] && [ "$o" = "yes" ]; then
              echo "all 3 certs present after ~$((i*2))s"
              break
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "certs not issued in time"
              docker compose logs vault-agent-gateway vault-agent-users vault-agent-orders
              exit 1
            fi
          done

      - name: Issue a test-client cert from Vault
        run: (cd vault && ./scripts/issue-test-client-cert.sh)

      - name: Wait for gateway to be reachable
        run: |
          # The gateway's Vault-issued cert has SAN=api-gateway only (see
          # gateway-role's allowed_domains in vault/scripts/setup-pki.sh) -
          # unlike the openssl-generated local-mtls-smoke-test certs, it does
          # NOT include "localhost". So we must connect with the SNI/Host
          # curl sends set to "api-gateway" while still routing to
          # 127.0.0.1, via --resolve - the same trick docs/DEPLOYMENT.md
          # documents for hitting the real deployed instance by IP.
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 \
              --resolve api-gateway:3000:127.0.0.1 \
              --cert certs/local/test-client/tls-cert.pem \
              --key certs/local/test-client/tls-key.pem \
              --cacert certs/local/test-client/ca-cert.pem \
              https://api-gateway:3000/healthz || echo "000")
            [ "$code" = "200" ] && { echo "gateway ready after ${i}s"; break; }
            sleep 1
            [ "$i" -eq 60 ] && { echo "gateway never became ready"; docker compose logs gateway; exit 1; }
          done

      - name: Run mTLS test suite against the Vault-issued certs
        run: ./scripts/test-mtls.sh https://api-gateway:3000 127.0.0.1

      - name: Prove rotation actually works
        run: |
          # rotation.log is appended to by split-bundle.sh every time Vault
          # Agent re-issues a cert (see vault/agent/split-bundle.sh). It
          # lives on the SAME named volume the gateway app reads certs
          # from, just visible through the vault-agent-gateway container.
          before_lines=$(docker compose exec -T vault-agent-gateway sh -c 'wc -l < /certs/rotation.log')
          before_cert=$(docker compose exec -T vault-agent-gateway sh -c 'md5sum /certs/tls-cert.pem')
          echo "rotation.log lines before: $before_lines"

          ./scripts/rotate-certs.sh all
          sleep 8

          after_lines=$(docker compose exec -T vault-agent-gateway sh -c 'wc -l < /certs/rotation.log')
          after_cert=$(docker compose exec -T vault-agent-gateway sh -c 'md5sum /certs/tls-cert.pem')
          echo "rotation.log lines after:  $after_lines"

          if [ "$after_lines" -le "$before_lines" ]; then
            echo "::error::rotate-certs.sh did not cause a new cert to be issued (rotation.log did not grow)"
            exit 1
          fi
          if [ "$before_cert" = "$after_cert" ]; then
            echo "::error::rotation.log grew but tls-cert.pem content is unchanged"
            exit 1
          fi
          echo "Confirmed: a new certificate was issued and written to disk."

          # and the service should still be answering mTLS requests post-rotation,
          # proving the app picked up the fresh cert (cert-watcher.ts -> restart)
          ./scripts/test-mtls.sh https://localhost:3000

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps -a ==="
          docker compose ps -a
          echo "=== docker compose logs (all services) ==="
          docker compose logs --no-color
          echo "=== vault-data-init logs specifically ==="
          docker compose logs --no-color vault-data-init || true

      - name: Tear down
        if: always()
        run: docker compose down -v
